# GitHub Action for generating a contribution graph with a snake eating your contributions.

name: Generate Snake

on:
  schedule:
    # every day at midnight UTC
    - cron: "0 0 * * *"

  # This command allows us to run the Action automatically from the Actions tab.
  workflow_dispatch:

  # Regenerate whenever the workflow itself changes.
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Required since the default GITHUB_TOKEN is read-only, and we push to the "output" branch.
    permissions:
      contents: write

    steps:
      # Generates the snake. The token lets the action read the contribution
      # calendar through the API instead of scraping the profile page.
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Push the generated files to the "output" branch. This keeps the main
      # branch from cluttering up.
      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
